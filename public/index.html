<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>NEXUS - Cổng Phân Phối Trò Chơi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <!-- Thư viện Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Three.js Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Custom Cursor -->
  <div id="cursor-bubble"></div>
  <div id="cursor-dot"></div>

  <!-- Header -->
  <header>
    <div class="brand">NEXUS<span>//PLAY</span></div>
    <nav>
      <button class="nav-btn active" id="tab-store" onclick="switchView('store')">CỬA HÀNG</button>
      <button class="nav-btn" id="tab-library" onclick="switchView('library')">THƯ VIỆN</button>
      <button class="btn-primary" onclick="toggleModal(true)">+ ĐĂNG BÁN GAME</button>
    </nav>
  </header>

  <!-- Nội dung chính -->
  <main class="container">
    <div class="hero">
      <h1>KHÔNG GIAN TRÒ CHƠI SỐ THẾ HỆ MỚI</h1>
      <p>Trải nghiệm mua sắm, nhận bản quyền kích hoạt CD-Key và quản lý thư viện trò chơi trực tuyến.</p>
    </div>

    <h2 class="section-title" id="view-title">DANH MỤC TRÒ CHƠI</h2>
    <div class="game-grid" id="game-grid"></div>
  </main>

  <!-- Modal Đăng Game -->
  <div class="modal-backdrop" id="modal-publish">
    <div class="modal">
      <h2>ĐĂNG BÁN TRÒ CHƠI MỚI</h2>
      <form id="publish-form" onsubmit="submitNewGame(event)">
        <div class="input-field">
          <label>Tên trò chơi</label>
          <input type="text" id="inp-title" required placeholder="Nhập tên game...">
        </div>
        <div class="input-field">
          <label>Thể loại</label>
          <select id="inp-tag">
            <option value="Sci-Fi RPG">Sci-Fi RPG</option>
            <option value="Action">Action</option>
            <option value="Strategy">Strategy</option>
            <option value="Indie">Indie</option>
          </select>
        </div>
        <div class="input-field">
          <label>Giá bán (USD)</label>
          <input type="number" step="0.01" id="inp-price" required placeholder="29.99">
        </div>
        <div class="input-field">
          <label>Mô tả ngắn</label>
          <textarea id="inp-desc" rows="3" placeholder="Tóm tắt về game..."></textarea>
        </div>
        <div class="modal-buttons">
          <button type="button" class="nav-btn" onclick="toggleModal(false)">Hủy</button>
          <button type="submit" class="btn-primary">Xác nhận đăng</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/background3d.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
